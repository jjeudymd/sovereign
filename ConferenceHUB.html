<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conference Schedule Hub</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --primary: #1a1a1a; --accent: #0066cc; --bg: #ffffff; }
        body { font-family: -apple-system, system-ui, sans-serif; background: #f9f9f9; margin: 0; color: #333; }
        
        header { background: white; border-bottom: 1px solid #eee; padding: 15px 20px; display: flex; align-items: center; position: sticky; top: 0; z-index: 100; height: 40px; }
        .back-btn { cursor: pointer; font-size: 28px; margin-right: 15px; display: none; color: var(--primary); font-weight: bold; }
        header h1 { margin: 0; font-size: 1rem; letter-spacing: 1px; text-transform: uppercase; font-weight: 800; flex-grow: 1; text-align: center; }

        .container { max-width: 650px; margin: 20px auto; padding: 0 15px; }
        .card { background: white; border-radius: 16px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid #f0f0f0; }

        /* Weekly Hub */
        .day-row { display: flex; align-items: center; padding: 20px 0; border-bottom: 1px solid #f4f4f4; cursor: pointer; transition: 0.2s; }
        .day-row:last-child { border-bottom: none; }
        .day-row:hover { background: #fafafa; }
        .calendar-icon { font-size: 24px; margin-right: 20px; color: #aaa; }
        .day-info { flex-grow: 1; overflow: hidden; }
        .day-name { font-weight: 700; color: var(--primary); font-size: 1.1rem; margin-bottom: 5px; }
        .preview-text { font-size: 0.85rem; color: #777; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Details View */
        #dayView { text-align: center; display: none; }
        .toggle-group { display: flex; background: #eee; border-radius: 50px; padding: 5px; margin-bottom: 30px; }
        .toggle-group button { flex: 1; border: none; background: none; padding: 12px; font-weight: 800; font-size: 0.8rem; color: #666; cursor: pointer; border-radius: 40px; }
        .toggle-group button.active { background: white; color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        
        .lecture-title { font-size: 1.4rem; font-weight: 850; color: #000; margin: 25px 0; line-height: 1.25; }
        #qrcode { background: white; padding: 15px; display: inline-block; border: 1px solid #eee; border-radius: 12px; margin-bottom: 20px; }
        
        .info-panel { text-align: left; background: #fcfcfc; border-radius: 12px; padding: 20px; border: 1px solid #eee; }
        .zoom-link { color: var(--accent); text-decoration: none; word-break: break-all; font-weight: 700; display: block; margin-bottom: 15px; font-size: 0.95rem; }
        .meeting-creds { color: #444; margin: 0; line-height: 1.6; font-family: 'Courier New', Courier, monospace; font-size: 0.9rem; }

        #status { text-align: center; margin-top: 150px; color: #bbb; font-weight: 600; }
    </style>
</head>
<body>

<header>
    <div id="backIcon" class="back-btn" onclick="showHome()">←</div>
    <h1 id="headerTitle">Conference Schedule</h1>
</header>

<div class="container">
    <div id="status">Syncing Schedule...</div>

    <!-- WEEKLY HUB -->
    <div id="homeView" class="card" style="display:none;">
        <div id="weeklyList"></div>
    </div>

    <!-- DETAIL VIEW -->
    <div id="dayView" class="card">
        <div class="toggle-group">
            <button id="amBtn" onclick="setSession('AM')">AM SESSION</button>
            <button id="pmBtn" onclick="setSession('PM')">PM SESSION</button>
        </div>
        <div id="dateLabel" style="font-size: 0.85rem; color: #999; font-weight: 800; letter-spacing: 2px;"></div>
        <div id="titleDisplay" class="lecture-title"></div>
        <div id="qrcode"></div>
        <div class="info-panel">
            <a id="urlDisplay" href="#" target="_blank" class="zoom-link"></a>
            <p id="credsDisplay" class="meeting-creds"></p>
        </div>
    </div>
</div>

<script>
    const SHEET_ID = '1gNy8iWiCZ8t-A_CYoIfBCJqJUrqwiByhzJ0-e0df9as';
    const GID = '0'; // Tab: "This Week"
    const DATA_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}`;

    let schedule = [];
    let currentIdx = 0;
    let qr = new QRCode(document.getElementById("qrcode"), { width: 260, height: 260 });

    async function init() {
        try {
            const res = await fetch(DATA_URL);
            const text = await res.text();
            const json = JSON.parse(text.substr(47).slice(0, -2));
            const rows = json.table.rows;

            // CRITICAL FIX: No longer slicing. We scan ALL rows and only include those with valid date objects.
            schedule = rows.map(r => {
                const dateVal = r.c[0] ? r.c[0].v : null;
                // Verify if column A contains a Google Date object
                if (dateVal && typeof dateVal === 'string' && dateVal.startsWith("Date")) {
                    return {
                        rawDate: dateVal,
                        formattedDate: formatDate(dateVal),
                        AM: parseContent(r.c[2] ? r.c[2].v : ""),
                        PM: parseContent(r.c[4] ? r.c[4].v : "")
                    };
                }
                return null;
            }).filter(item => item !== null);

            renderHub();
            document.getElementById('status').style.display = 'none';
            document.getElementById('homeView').style.display = 'block';
        } catch (e) {
            document.getElementById('status').innerText = "Connection failed. Please check spreadsheet publication.";
        }
    }

    function formatDate(val) {
        // Formats Date(2026, 4, 18) -> MON, May 18
        const parts = val.match(/\d+/g);
        const d = new Date(parts[0], parts[1], parts[2]);
        const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        return `${days[d.getDay()]}, ${months[d.getMonth()]} ${String(d.getDate()).padStart(2, '0')}`;
    }

    function parseContent(text) {
        if (!text || text.toLowerCase().includes("no conference")) {
            return { title: "No Conference Scheduled", url: "", info: "" };
        }
        const lines = text.split('\n');
        const urlMatch = text.match(/https?:\/\/[^\s]+/);
        const info = lines.filter(l => l.includes("ID") || l.includes("Passcode")).join(" | ");
        return { 
            title: lines[0].trim(), 
            url: urlMatch ? urlMatch[0] : "", 
            info: info 
        };
    }

    function renderHub() {
        const list = document.getElementById('weeklyList');
        list.innerHTML = '';
        schedule.forEach((day, index) => {
            const row = document.createElement('div');
            row.className = 'day-row';
            row.onclick = () => openDetails(index);
            row.innerHTML = `
                <div class="calendar-icon">📅</div>
                <div class="day-info">
                    <div class="day-name">${day.formattedDate}</div>
                    <div class="preview-text">AM: ${day.AM.title}</div>
                    <div class="preview-text">PM: ${day.PM.title}</div>
                </div>
            `;
            list.appendChild(row);
        });
    }

    function openDetails(index) {
        currentIdx = index;
        document.getElementById('homeView').style.display = 'none';
        document.getElementById('dayView').style.display = 'block';
        document.getElementById('backIcon').style.display = 'block';
        document.getElementById('headerTitle').innerText = "Session Detail";
        setSession('AM');
    }

    function showHome() {
        document.getElementById('homeView').style.display = 'block';
        document.getElementById('dayView').style.display = 'none';
        document.getElementById('backIcon').style.display = 'none';
        document.getElementById('headerTitle').innerText = "Conference Schedule";
    }

    function setSession(type) {
        document.getElementById('amBtn').classList.toggle('active', type === 'AM');
        document.getElementById('pmBtn').classList.toggle('active', type === 'PM');
        
        const day = schedule[currentIdx];
        const data = day[type];
        
        document.getElementById('dateLabel').innerText = day.formattedDate;
        document.getElementById('titleDisplay').innerText = data.title;
        document.getElementById('urlDisplay').innerText = data.url;
        document.getElementById('urlDisplay').href = data.url;
        document.getElementById('credsDisplay').innerText = data.info;

        qr.clear();
        if (data.url) {
            document.getElementById('qrcode').style.display = 'inline-block';
            qr.makeCode(data.url);
        } else {
            document.getElementById('qrcode').style.display = 'none';
        }
    }

    init();
</script>
</body>
</html>
